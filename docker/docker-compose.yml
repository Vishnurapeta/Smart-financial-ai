version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Primary Database: MongoDB 7.0
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: smartfin-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: smartfin_ai_dev
    volumes:
      - mongodb_data:/data/db
    networks:
      - smartfin-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # In-Memory Cache & Message Broker: Redis 7.0
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.0-alpine
    container_name: smartfin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - smartfin-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Machine Learning Microservice: Python / FastAPI
  # ----------------------------------------------------------------------------
  ml-service:
    build:
      context: ../ml-service
      dockerfile: Dockerfile
    container_name: smartfin-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHON_ENV=development
      - PORT=8000
      - HOST=0.0.0.0
      - SERVICE_AUTH_TOKEN=dev_internal_secret_token_12345
    volumes:
      - ../ml-service:/app
    networks:
      - smartfin-network

  # ----------------------------------------------------------------------------
  # Core Application Backend: Node.js / Express
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: smartfin-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/smartfin_ai_dev
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ML_SERVICE_URL=http://ml-service:8000
      - ML_SERVICE_SECRET_TOKEN=dev_internal_secret_token_12345
      - CORS_ORIGIN=http://localhost:5173
      - DATA_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - JWT_ACCESS_SECRET=dev_jwt_access_secret_super_secure_32_chars
      - JWT_REFRESH_SECRET=dev_jwt_refresh_secret_super_secure_32_chars
      - COOKIE_SECRET=dev_cookie_secret_string_12345
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - smartfin-network

  # ----------------------------------------------------------------------------
  # Presentation Client: React / Vite
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: smartfin-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api/v1
      - VITE_ML_SERVICE_URL=http://localhost:8000
      - VITE_SOCKET_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - smartfin-network

volumes:
  mongodb_data:
  redis_data:

networks:
  smartfin-network:
    driver: bridge
